version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - unparam
    - unused

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
        - (net/http.ResponseWriter).Write
        - (*net/http.HttpServletResponse).Write
